<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Diesel Buddy — Trip Cost & Driver Tools</title>
  <link rel="icon" href="/db-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    :root{
      --bg:#f7fafc; --ink:#0b1220; --muted:#4a5b73; --card:#ffffff; --border:#e6eef6;
      --pill:#f4f7fb; --accent:#c4762b; --accent-2:#2b7ac4; --danger:#c13b3b; --shadow:0 14px 35px rgba(16,38,76,.08); --radius:16px;
    }
    body{
      margin:0;color:var(--ink);background:
      radial-gradient(1200px 600px at 90% -20%, rgba(43,122,196,.07), transparent 60%),
      radial-gradient(1000px 600px at -20% 10%, rgba(196,118,43,.08), transparent 60%),
      var(--bg);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }
    header{
      display:flex;gap:12px;align-items:center;padding:16px 20px;position:sticky;top:0;z-index:10;
      background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
    }
    .logo{width:60px;height:60px;border-radius:12px;display:block;object-fit:contain;background:transparent;
      box-shadow:0 0 0 1px rgba(196,118,43,.18),0 6px 18px rgba(196,118,43,.12);}
    .brand h1{font-size:18px;margin:0}
    .tag{color:var(--muted);font-size:12px;margin-top:2px}
    .wrap{max-width:1120px;margin:20px auto;padding:0 16px}
    .row{display:grid;grid-template-columns:1fr 400px;gap:16px}
    .card {
      border-radius: 20px;
      box-shadow: 0 6px 28px 0 rgba(43,122,196,.09), 0 1.5px 6px 0 rgba(196,118,43,.04);
      background: linear-gradient(180deg, #fff 85%, #f8fafb 100%);
      border: 1px solid #ececec;
      padding:18px;
    }
    h3{margin:0 0 12px}label{display:block;font-weight:600;margin:10px 0 6px}
    input, select {
      border-radius: 14px;
      border: 1.5px solid #e0e5ea;
      font-size: 16px;
      font-weight: 500;
      background: #fbfcfd;
      padding: 13px 12px;
      transition: border 0.18s, box-shadow 0.14s;
    }
    input:focus, select:focus {
      border-color: #c4762b;
      box-shadow: 0 0 0 2px #ffe9d2;
    }
    .btn {
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: linear-gradient(90deg, #ffce91 25%, #e48c2d 100%);
      color: #4b2b0b;
      box-shadow: 0 3px 8px rgba(196,118,43,.09);
      border:0;
      padding:12px 16px;
      cursor:pointer;
      transition:transform .08s,filter .12s;
    }
    .btn:hover { filter:brightness(1.07) saturate(1.06);}
    .btn.secondary{background:#fff7ef;color:#7a431b;border:1px solid #f3d5b5;box-shadow:none}
    .btn.secondary:hover{box-shadow:0 8px 24px rgba(16,38,76,.08);border-color:#eec8a1;}
    .btn.danger{background:#f3e7e7;color:#8b2b2b;border:1px solid #edd2d2}
    .btn-row{display:flex;gap:10px;flex-wrap:wrap}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .pill{display:inline-block;background:var(--pill);padding:6px 10px;border-radius:999px;font-size:12px;color:#5a4030;border:1px solid var(--border)}
    .muted{color:var(--muted);font-size:12px}
    .result{font-size:16px;line-height:1.55}
    .stops{display:grid;gap:8px}
    .stop-row{display:grid;grid-template-columns:1fr auto;gap:8px}
    .stop-row .rm{padding:8px 12px}
    .hr{height:1px;background:var(--border);margin:12px 0}
    .tabs{display:flex;gap:8px;margin-bottom:12px}
    .tab{padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:#fff;cursor:pointer;color:#7a431b}
    .tab.active{background:#fff4ea;color:#7a431b;border-color:#f3d5b5}
    .compare{display:grid;gap:12px}
    .cmp-card{border:1px solid var(--border);background:#fff;border-radius:14px;padding:12px}
    .cmp-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .cmp-title h4{margin:0;font-size:14px}
    .x{background:#fff7ef;color:#7a431b;border:1px solid #f3d5b5;border-radius:10px;padding:6px 10px;cursor:pointer}
    .linkbar a{color:var(--accent-2);text-decoration:none;margin-right:10px}
    .linkbar a:hover{text-decoration:underline}
    .status{min-height:20px;margin-top:8px}
    .badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}
    .badge.green{background:#0f2b22;color:#2ee6a3;border:1px solid #1f6a54}
    .badge.yellow{background:#2b2a0f;color:#ffd966;border:1px solid #726915}
    .badge.red{background:#2b0f11;color:#ff9aa2;border:1px solid #7a2228}
    #hosPlan .rowline{display:flex;gap:12px;align-items:center;margin-top:8px}
    #hosPlan .big{font-size:18px;font-weight:700}
    .city-suggest-list {
      background: #fff;
      border-radius: 18px;
      border: 1px solid #f3d5b5;
      box-shadow: 0 4px 24px rgba(43,122,196,0.13);
      position:absolute;
      z-index:1000;
      max-height:190px;
      overflow-y:auto;
      width: 98%;
      margin-top:2px;
      left:1%;
    }
    .city-suggest-item {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 15px;
      color: #473117;
      border-bottom:1px solid #f6e3ce;
      background: #fff;
      transition: background .11s;
    }
    .city-suggest-item:last-child { border-bottom: none; }
    .city-suggest-item:hover { background: #fff5ea; }
    #fuelMeta {
      background: #fff7ed;
      border-radius: 10px;
      padding: 8px 13px;
      margin-top: 8px;
      display: inline-block;
      color: #a45c1e;
      font-weight: 600;
      font-size: 13px;
      box-shadow: 0 2px 8px 0 rgba(196,118,43,.08);
    }
  </style>
</head>
<body>
  <header>
    <img class="logo"
      src="/db-logo.svg"
      alt="Diesel Buddy logo"
      width="60"
      height="60"
      onerror="this.style.display='none'" />
    <div class="brand">
      <h1>Diesel Buddy</h1>
      <div class="tag">Owner & Driver tools</div>
    </div>
    <div style="flex:1"></div>
    <div class="btn-row">
      <button id="save" class="btn secondary">Save to Compare</button>
      <button id="clear" class="btn danger">Clear</button>
    </div>
  </header>
  <div class="wrap">
    <div class="tabs">
      <button class="tab active" data-panel="owner">Owner/Calc</button>
      <button class="tab" data-panel="driver">Driver</button>
      <button class="tab" data-panel="vendors">Vendors</button>
    </div>
    <div id="owner" class="panel" style="display:block">
      <div class="row">
        <div class="card">
          <h3>Route</h3>
          <label>Start (City, State)</label>
          <div style="position:relative;">
            <input id="start" type="text" placeholder="Los Angeles, CA" autocomplete="off"/>
            <div id="citySuggestBox" class="city-suggest-list" style="display:none"></div>
          </div>
          <div class="stops" id="stops"></div>
          <button class="btn secondary" id="addStop">+ Add Stop</button>
          <label style="margin-top:14px">Final Drop (City, State)</label>
          <input id="end" type="text" placeholder="Miami, FL"/>
          <div class="hr"></div>
          <h3>Truck & Rate</h3>
          <div class="grid3">
            <div>
              <label>Fuel Price ($/gal)</label>
              <input id="fuel" type="number" step="0.01" value="3.45"/>
              <div id="fuelMeta" class="muted"></div>
            </div>
            <div>
              <label>MPG</label>
              <input id="mpg" type="number" step="0.1" value="8"/>
            </div>
            <div>
              <label>Load Pay ($)</label>
              <input id="rate" type="number" step="0.01" value="500"/>
            </div>
          </div>
          <div class="grid2" style="margin-top:12px">
            <div>
              <label>Truck Preset</label>
              <select id="preset">
                <option value="custom">Custom</option>
                <option value="box26">26' Box (Non-CDL)</option>
                <option value="daycab">Day Cab</option>
                <option value="sleeper">Sleeper</option>
              </select>
            </div>
          </div>
          <div class="grid2" style="margin-top:12px">
            <div><label>Tank Size (gal)</label><input id="tank" type="number" step="1" value="26"/></div>
            <div><label>Refuel Threshold (%)</label><input id="refuelPct" type="number" step="5" value="20"/></div>
          </div>
          <div class="btn-row" style="margin-top:14px">
            <button class="btn" id="calc">Calculate</button>
            <span class="status muted" id="status"></span>
          </div>
        </div>
        <div class="card">
          <h3>Results</h3>
          <div id="results" class="result">Enter locations and click Calculate.</div>
          <div class="hr"></div>
          <div id="map" style="height:300px; border-radius:16px; margin-top:16px; box-shadow:0 8px 24px rgba(43,122,196,0.08)"></div>
          <div class="muted">Tank range & refuel alerts:</div>
          <div id="range" class="result" style="margin-top:6px;"></div>
        </div>
      </div>
      <div class="card" style="margin-top:16px">
        <h3>Compare (max 3)</h3>
        <div id="compare" class="compare"></div>
      </div>
    </div>
  </div>
  <script>
    // ------------  KEYS (insert yours)  ----------------
    const MAPBOX_TOKEN = 'pk.eyJ1IjoiamhvbGx5ODgiLCJhIjoiY21ocXI0ZDBuMHJpYzJscWN2cnMxbGRkMyJ9.49ztcPC2Gkt6NkYHiL-IBg'; // <--- PASTE your Mapbox token here (keep quotes)
    const RAPIDAPI_KEY = '6141aad7b6msh58fd9568d3b752ap140ee5jsn26a240bba2ac'; // <--- PASTE your RapidAPI key here if using live diesel
    // ---------------------------------------------------
    
    // City autocomplete
    const CITY_STATE_LIST = [
      "New York, NY", "Los Angeles, CA", "Chicago, IL", "Houston, TX", "Phoenix, AZ", "Philadelphia, PA",
      "San Antonio, TX", "San Diego, CA", "Dallas, TX", "San Jose, CA", "Austin, TX", "Jacksonville, FL",
      "Fort Worth, TX", "Columbus, OH", "San Francisco, CA", "Charlotte, NC", "Indianapolis, IN",
      "Seattle, WA", "Denver, CO", "Washington, DC", "Boston, MA", "El Paso, TX", "Nashville, TN",
      "Detroit, MI", "Oklahoma City, OK", "Portland, OR", "Las Vegas, NV", "Memphis, TN",
      "Louisville, KY", "Baltimore, MD", "Milwaukee, WI", "Albuquerque, NM", "Tucson, AZ",
      "Fresno, CA", "Mesa, AZ", "Sacramento, CA", "Atlanta, GA", "Kansas City, MO", "Colorado Springs, CO",
      "Miami, FL", "Raleigh, NC", "Omaha, NE", "Long Beach, CA", "Virginia Beach, VA",
      "Oakland, CA", "Minneapolis, MN", "Tulsa, OK", "Arlington, TX", "Tampa, FL"
    ];
    const startInput = document.getElementById('start');
    const citySuggestBox = document.getElementById('citySuggestBox');
    if (startInput) {
      startInput.addEventListener('input', function() {
        const v = this.value.trim().toLowerCase();
        citySuggestBox.innerHTML = '';
        if (v.length < 2) { citySuggestBox.style.display = 'none'; return; }
        const matches = CITY_STATE_LIST.filter(cs => cs.toLowerCase().includes(v)).slice(0,8);
        if (matches.length) {
          citySuggestBox.style.display = 'block';
          matches.forEach(cs => {
            const div = document.createElement('div');
            div.textContent = cs;
            div.className = 'city-suggest-item';
            div.onclick = () => {
              startInput.value = cs;
              citySuggestBox.style.display = 'none';
              startInput.blur();
            };
            citySuggestBox.appendChild(div);
          });
        } else {
          citySuggestBox.style.display = 'none';
        }
      });
      document.addEventListener('click', (e) => {
        if (!citySuggestBox.contains(e.target) && e.target !== startInput) {
          citySuggestBox.style.display = 'none';
        }
      });
    }

    // Presets logic
    const PRESETS = {
      box26:   { mpg: 8.0, tank: 70 },
      daycab:  { mpg: 6.5, tank: 120 },
      sleeper: { mpg: 6.0, tank: 150 }
    };
    function applyPreset(key){
      const p = PRESETS[key]; if(!p) return;
      const mpg = document.getElementById('mpg');
      const tank = document.getElementById('tank');
      if(mpg)  mpg.value  = p.mpg;
      if(tank) tank.value = p.tank;
      saveFields();
    }
    const presetSel = document.getElementById('preset');
    if(presetSel){
      presetSel.addEventListener('change', ()=>{
        if(presetSel.value !== 'custom') applyPreset(presetSel.value);
      });
    }

    // Compare/save logic
    const saveBtn=document.getElementById('save'); const clearBtn=document.getElementById('clear'); const cmpDiv=document.getElementById('compare');
    function loadSaves(){ const a=JSON.parse(localStorage.getItem('db_saves')||'[]'); renderCompare(a); }
    function saveEntry(entry){ let a=JSON.parse(localStorage.getItem('db_saves')||'[]'); if(a.length>=3) a.shift(); a.push(entry); localStorage.setItem('db_saves',JSON.stringify(a)); renderCompare(a); }
    function removeEntry(i){ let a=JSON.parse(localStorage.getItem('db_saves')||'[]'); a.splice(i,1); localStorage.setItem('db_saves',JSON.stringify(a)); renderCompare(a); }
    function renderCompare(a){ cmpDiv.innerHTML=''; a.forEach((e,i)=>{ const el=document.createElement('div'); el.className='cmp-card'; el.innerHTML=`<div class="cmp-title"><h4>${e.title}</h4><button class="x" data-i="${i}">Remove</button></div>
      <div class="muted">${e.legs}</div>
      <div class="result" style="margin-top:6px">
        <div><span class="pill">Miles</span> ${e.miles} • <span class="pill">ETA</span> ${e.eta}</div>
        <div><span class="pill">Fuel</span> ${e.gallons} gal ($${e.fuelCost})</div>
        <div><span class="pill">Gross</span> $${e.rate} • <span class="pill">Net</span> $${e.net}</div>
        <div><span class="pill">$/mi (gross)</span> ${e.rpmGross} • <span class="pill">$/mi (net)</span> ${e.rpmNet} ${rpmBadge(parseFloat(e.rpmNet))}</div>
      </div>`; cmpDiv.appendChild(el); el.querySelector('.x').onclick=()=>removeEntry(i); }); }
    clearBtn.addEventListener('click',()=>{ ['start','end','fuel','mpg','rate','tank','refuelPct'].forEach(id=>document.getElementById(id).value=''); document.querySelectorAll('.stop').forEach(s=>s.value=''); document.getElementById('results').textContent=''; document.getElementById('range').textContent=''; document.getElementById('status').textContent=''; saveFields(); });
    function saveFields(){
      const obj = {};
      ['start','end','fuel','mpg','rate','tank','refuelPct'].forEach(id => { const el=document.getElementById(id); if(el) obj[id]=el.value; });
      const preset = document.getElementById('preset'); if(preset) obj.preset = preset.value;
      localStorage.setItem('db_fields', JSON.stringify(obj));
    }
    function loadFields(){
      try{
        const raw = localStorage.getItem('db_fields'); if(!raw) return;
        const obj = JSON.parse(raw);
        ['start','end','fuel','mpg','rate','tank','refuelPct'].forEach(id => { if(obj[id]!=null && document.getElementById(id)) document.getElementById(id).value = obj[id]; });
        if(obj.preset && document.getElementById('preset')){
          document.getElementById('preset').value = obj.preset;
        }
      }catch{}
    }
    ['start','end','fuel','mpg','rate','tank','refuelPct'].forEach(id => { const el=document.getElementById(id); if(el) el.addEventListener('input', saveFields); });
    if(presetSel) presetSel.addEventListener('change', saveFields);

    // Map display, using Mapbox truck route polyline
    let map, routeLayer, mapMarkers = [];
    async function showMapRoute(points) {
      if (!map) {
        map = L.map('map').setView([37.8, -96.9], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 18,
          attribution: '© OpenStreetMap contributors'
        }).addTo(map);
      }
      if(routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
      mapMarkers.forEach(m => map.removeLayer(m));
      mapMarkers = [];
      if(points && points.length > 1) {
        let allCoords = [];
        for(let i=0;i<points.length-1;i++) {
          const leg = await route(points[i], points[i+1]);
          if(leg.geometry && leg.geometry.coordinates) {
            allCoords.push(...leg.geometry.coordinates.map(([lon, lat]) => [lat, lon]));
          }
        }
        if(allCoords.length) {
          routeLayer = L.polyline(allCoords, {color:'#2b7ac4',weight:5,opacity:0.7}).addTo(map);
          map.fitBounds(routeLayer.getBounds(), {padding:[40,40]});
          mapMarkers.push(L.marker([points[0].lat, points[0].lon], {title:'Start'}).addTo(map));
          mapMarkers.push(L.marker([points[points.length-1].lat, points[points.length-1].lon], {title:'End'}).addTo(map));
        }
      }
    }

    // --- REAL GEOCODE & TRUCK ROUTING
    async function geocode(q) {
      const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(q)}.json?access_token=${MAPBOX_TOKEN}&limit=1`;
      const res = await fetch(url);
      const data = await res.json();
      if(data.features && data.features.length > 0) {
        const [lon, lat] = data.features[0].center;
        return {lat, lon};
      }
      throw new Error('Geocoding failed for: ' + q);
    }
    async function route(a, b) {
  const url =
    `https://api.mapbox.com/directions/v5/mapbox/driving-traffic/${a.lon},${a.lat};${b.lon},${b.lat}` +
    `?access_token=${MAPBOX_TOKEN}` +
    `&geometries=geojson&overview=full` +
    `&annotations=distance,duration` +
    `&approaches=unrestricted;unrestricted` +
    `&exclude=ferry,toll`;
  const res = await fetch(url);
  const data = await res.json();
  if(data.routes && data.routes.length > 0) {
    const r = data.routes[0];
    return {
      meters: r.distance,
      seconds: r.duration,
      geometry: r.geometry
    };
  }
  throw new Error('Routing failed');
}

    // Diesel fallback and live price (RapidAPI + fallback)
    const STATE_DIESEL = {
      AL:3.90, AK:4.50, AZ:4.30, AR:3.85, CA:5.20, CO:4.10, CT:4.70, DE:4.10, FL:4.20, GA:4.05,
      HI:5.60, ID:4.40, IL:4.80, IN:4.35, IA:4.10, KS:3.95, KY:4.10, LA:3.85, ME:4.60, MD:4.35,
      MA:4.50, MI:4.25, MN:4.10, MS:3.85, MO:3.90, MT:4.30, NE:4.00, NV:4.70, NH:4.45, NJ:4.45,
      NM:4.10, NY:4.65, NC:4.05, ND:4.15, OH:4.10, OK:3.80, OR:4.70, PA:4.85, RI:4.45, SC:3.95,
      SD:4.10, TN:3.95, TX:3.90, UT:4.25, VT:4.55, VA:4.05, WA:5.00, WV:4.20, WI:4.05, WY:4.15,
      DC:4.75
    };
    function parseStateAbbr(s){ if(!s) return null; const parts=s.split(','); if(parts.length<2) return null; const ab=parts[parts.length-1].trim().toUpperCase(); return ab.slice(0,2); }
    function fallbackFuelFromInputs(){ const a=parseStateAbbr(document.getElementById('start').value); const b=parseStateAbbr(document.getElementById('end').value);
      const pa=STATE_DIESEL[a]||null, pb=STATE_DIESEL[b]||null;
      if(pa && pb) return { price: (pa+pb)/2, meta:'baseline' };
      if(pa) return { price: pa, meta:'baseline' };
      if(pb) return { price: pb, meta:'baseline' };
      return { price:null, meta:'manual' };
    }
    async function getLiveDieselPrice(city, state) {
      try {
        const resp = await fetch(
          `https://gas-price.p.rapidapi.com/gasPrice/from-city?city=${encodeURIComponent(city)}&state=${encodeURIComponent(state)}&country=usa`,
          {
            headers: {
              'X-RapidAPI-Key': RAPIDAPI_KEY,
              'X-RapidAPI-Host': 'gas-price.p.rapidapi.com'
            }
          }
        );
        if (!resp.ok) throw new Error('API request failed');
        const data = await resp.json();
        if (!data.result || !Array.isArray(data.result)) throw new Error('No price data returned');
        const station = data.result.find(x => x.diesel && !isNaN(parseFloat(x.diesel)));
        if (station) {
          return {
            price: parseFloat(station.diesel),
            meta: `live: $${station.diesel} (${station.name}, ${station.address})`
          };
        } else {
          return null;
        }
      } catch (e) {
        return null;
      }
    }

    // Badge for $/mi
    function rpmBadge(v){
      if(isNaN(v)) return '';
      const cls = v>=2 ? 'green' : (v>=1.5 ? 'yellow' : 'red');
      return `<span class="badge ${cls}">${v.toFixed(2)} /mi</span>`;
    }

    // CALCULATE!
    let lastGeos=null, lastNames=null, lastTotals=null;
    document.getElementById('calc').addEventListener('click', async ()=>{
      const start=document.getElementById('start').value.trim();
      const end=document.getElementById('end').value.trim();
      const stops=Array.from(document.querySelectorAll('.stop')).map(i=>i.value.trim()).filter(Boolean);
      const fuelInput=parseFloat(document.getElementById('fuel').value||'0');
      const mpg=parseFloat(document.getElementById('mpg').value||'0');
      const rate=parseFloat(document.getElementById('rate').value||'0');
      const tank=parseFloat(document.getElementById('tank').value||'0');
      const status=document.getElementById('status'); const results=document.getElementById('results'); const rangeEl=document.getElementById('range'); const fuelMeta=document.getElementById('fuelMeta');
      results.textContent=''; rangeEl.textContent=''; status.textContent='Calculating…';
      try{
        if(!start||!end) throw new Error('Please enter Start and Final Drop.');
        const names=[start,...stops,end];
        const geos=[]; for(const n of names) geos.push(await geocode(n));
        lastGeos = geos; lastNames = names;
        await showMapRoute(geos);

        // LIVE FUEL PRICE via RAPIDAPI + FALLBACK
        let autoFuel = null;
        let liveFuelMeta = '';
        if (start.includes(',')) {
          const [cityRaw, stateRaw] = start.split(',');
          const city = cityRaw.trim();
          const state = stateRaw.trim().toUpperCase();
          if (city && state.length === 2 && RAPIDAPI_KEY && RAPIDAPI_KEY !== 'YOUR_RAPIDAPI_KEY') {
            const livePrice = await getLiveDieselPrice(city, state);
            if (livePrice && typeof livePrice.price === "number") {
              autoFuel = livePrice.price;
              liveFuelMeta = livePrice.meta;
              document.getElementById('fuel').value = autoFuel.toFixed(2);
              if (fuelMeta) fuelMeta.textContent = liveFuelMeta;
            }
          }
        }
        if (autoFuel == null) {
          const fb = fallbackFuelFromInputs();
          if(fb.price){ autoFuel = fb.price; if (fuelMeta) fuelMeta.textContent=`auto: ${autoFuel.toFixed(2)} (baseline)`; }
          else if (fuelMeta) { fuelMeta.textContent='manual'; }
          if(Number.isFinite(autoFuel)) document.getElementById('fuel').value = autoFuel.toFixed(2);
        }
        const fuel = Number.isFinite(autoFuel) ? autoFuel : fuelInput;

        // Route all legs
        let totalMeters=0,totalSeconds=0; const legLabels=[];
        for(let i=0;i<geos.length-1;i++){ const leg=await route(geos[i],geos[i+1]); totalMeters+=leg.meters; totalSeconds+=leg.seconds; legLabels.push(`${names[i]} → ${names[i+1]}`); }
        lastTotals={meters:totalMeters, seconds:totalSeconds};

        const miles=totalMeters/1609.344;
        const gallons = mpg>0 ? miles/mpg : 0;
        const fuelCost = gallons * fuel;
        const net = rate - fuelCost;
        const rpmGross = miles>0 ? (rate/miles) : 0;
        const rpmNet   = miles>0 ? (net/miles)   : 0;

        results.innerHTML = `
          <div><span class="pill">One-way miles</span> <strong>${miles.toFixed(1)} mi</strong> • <span class="pill">ETA</span> ${Math.floor(totalSeconds/3600)}h ${Math.round((totalSeconds%3600)/60)}m</div>
          <div style="margin-top:6px"><span class="pill">Fuel used</span> ${gallons.toFixed(1)} gal • <span class="pill">Fuel cost</span> $ ${fuelCost.toFixed(2)}</div>
          <div style="margin-top:6px"><span class="pill">Gross pay</span> $ ${rate.toFixed(2)} • <span class="pill">Net after fuel</span> $ ${net.toFixed(2)}</div>
          <div style="margin-top:6px"><span class="pill">$/mi (gross)</span> ${rpmGross.toFixed(2)} • <span class="pill">$/mi (net)</span> ${rpmNet.toFixed(2)} ${rpmBadge(rpmNet)}</div>
        `;

        // Tank range & refuel alert
        if(tank>0 && mpg>0){
          const range = tank * mpg; const stopsNeeded = Math.max(0, Math.ceil((miles - range)/range));
          rangeEl.innerHTML = `<div><span class="pill">Tank range</span> ~${Math.round(range)} mi (${tank} gal @ ${mpg} mpg)</div>
          <div style="margin-top:6px"><span class="pill">Refuel alert</span> ${stopsNeeded>0? '<span style="color:var(--danger)">Plan '+stopsNeeded+' stop(s)</span>':'No refuel needed'}</div>`;
        }

        // Save to Compare
        saveBtn.onclick=()=>{ saveEntry({
          title:`${names[0]} → ${names[names.length-1]}`,
          legs:legLabels.join(' · '),
          miles:miles.toFixed(1),
          eta:`${Math.floor(totalSeconds/3600)}h ${Math.round((totalSeconds%3600)/60)}m`,
          gallons:gallons.toFixed(1),
          fuelCost:fuelCost.toFixed(2),
          rate:rate.toFixed(2),
          net:net.toFixed(2),
          rpmGross:rpmGross.toFixed(2),
          rpmNet:rpmNet.toFixed(2)
        }); status.textContent='Saved to Compare.'; };

        status.textContent='Done.';
        // Truck warning message
        if (document.getElementById('preset').value !== 'custom') {
          status.innerHTML += '<br><span style="color:#c4762b">Strict truck routing (low bridge avoidance, hazmat, etc) <b>coming soon</b>!<br>Currently using standard route, avoiding tolls/ferries.</span>';
    }               
        saveFields();
      }catch(e){ console.error(e); status.textContent=e.message; }
    });

    loadFields();
    loadSaves();
    
  </script>
</body>
</html>
